apply plugin: 'com.android.application'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'

android {
    namespace = "com.timurindustries.calculator"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.timurindustries.calculator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'com.google.android.gms:play-services-oss-licenses:17.3.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.configureEach {
    if (name == 'releaseOssLicensesTask') {
        doLast {
            def licenseDirectory = file("$buildDir/generated/res/releaseOssLicensesTask/raw")
            def licenseTextFile = rootProject.file('../node_modules/@capacitor/android/LICENSE')
            def bundledLicensesFile = new File(licenseDirectory, 'third_party_licenses')
            def licenseMetadataFile = new File(licenseDirectory, 'third_party_license_metadata')

            if (!licenseTextFile.isFile()) {
                throw new GradleException("Capacitor Android license file not found: $licenseTextFile")
            }

            def licenseTitle = 'Capacitor Android'
            if (!licenseMetadataFile.readLines('UTF-8').any { it.endsWith(" $licenseTitle") }) {
                def licenseEntry = "${licenseTitle}\n\n${licenseTextFile.getText('UTF-8').trim()}\n"
                def licenseEntryBytes = licenseEntry.getBytes('UTF-8')
                def licenseOffset = bundledLicensesFile.length()

                bundledLicensesFile.append(licenseEntry, 'UTF-8')
                licenseMetadataFile.append("${licenseOffset}:${licenseEntryBytes.length} ${licenseTitle}\n", 'UTF-8')
            }

            def licenseBytes = bundledLicensesFile.bytes
            def metadataLines = licenseMetadataFile.readLines('UTF-8')
            def licenseEntries = metadataLines.collect { line ->
                def matcher = line =~ /^(\d+):(\d+) (.+)$/
                if (!matcher.matches()) {
                    throw new GradleException("Invalid open-source license metadata entry: $line")
                }

                def offset = matcher[0][1].toInteger()
                def length = matcher[0][2].toInteger()
                [
                    offset: offset,
                    length: length,
                    name: matcher[0][3],
                    text: new String(licenseBytes, offset, length, 'UTF-8')
                ]
            }
            def apacheLicense = licenseEntries.find { entry ->
                def text = entry.text.trim()
                text.startsWith('Apache License') &&
                    text.contains('Version 2.0') &&
                    text.contains('END OF TERMS AND CONDITIONS')
            }

            if (apacheLicense == null) {
                throw new GradleException('Full Apache 2.0 license text was not found in generated license resources')
            }

            def replacedApacheUrl = false
            def updatedMetadata = licenseEntries.collect { entry ->
                if (entry.text.trim() in [
                    'http://www.apache.org/licenses/LICENSE-2.0.txt',
                    'https://www.apache.org/licenses/LICENSE-2.0.txt'
                ]) {
                    replacedApacheUrl = true
                    return "${apacheLicense.offset}:${apacheLicense.length} ${entry.name}"
                }
                "${entry.offset}:${entry.length} ${entry.name}"
            }

            if (replacedApacheUrl) {
                licenseMetadataFile.setText(updatedMetadata.join('\n') + '\n', 'UTF-8')
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
